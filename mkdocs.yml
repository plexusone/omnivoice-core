site_name: OmniVoice
site_description: Voice abstraction layer for PlexusOne supporting TTS, STT, and Voice Agents
site_url: https://plexusone.github.io/omnivoice-core
repo_url: https://github.com/plexusone/omnivoice-core
repo_name: plexusone/omnivoice-core

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - Outbound Calls and Keypad Digits: guides/outbound-calls.md
      - Local TTS/STT Providers: guides/local-tts.md
      - Terminology (Pronunciation & Case): guides/terminology.md
      - Transcript Format: guides/transcript.md
      - Testing with Mocks: guides/testing.md
      - Observability: guides/observability.md
      - Provider Registry: guides/registry.md
      - Voice Cloning: guides/voice-cloning.md
      - Session Storage: guides/storage.md
      - Barge-in Detection: guides/bargein.md
      - Realtime Voice-to-Voice: guides/realtime.md
  - Design:
      - Architecture:
          - Voice Architecture: design/architecture/voice-architecture.md
  - Specs:
      - Roadmap: specs/ROADMAP.md
      - Voice Integration PRD: specs/voice-integration/PRD.md
      - Twilio Integration TRD: specs/twilio-integration/TRD.md
      - Provider Conformance Testing: specs/provider-conformance/TRD.md
      - Local Providers:
          - PRD: specs/features/local/PRD.md
          - TRD: specs/features/local/TRD.md
          - Roadmap: specs/features/local/ROADMAP.md
  - Changelog: changelog.md
  - Releases:
      - v0.17.0: releases/v0.17.0.md
      - v0.16.0: releases/v0.16.0.md
      - v0.15.0: releases/v0.15.0.md
      - v0.14.0: releases/v0.14.0.md
      - v0.13.0: releases/v0.13.0.md
      - v0.12.1: releases/v0.12.1.md
      - v0.12.0: releases/v0.12.0.md
      - v0.11.0: releases/v0.11.0.md
      - v0.10.0: releases/v0.10.0.md
      - v0.9.0: releases/v0.9.0.md
      - v0.8.0: releases/v0.8.0.md
      - v0.7.0: releases/v0.7.0.md
      - v0.6.0: releases/v0.6.0.md
      - v0.5.0: releases/v0.5.0.md
      - v0.4.1: releases/v0.4.1.md
      - v0.4.0: releases/v0.4.0.md
      - v0.3.0: releases/v0.3.0.md
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/omnivoice-core
